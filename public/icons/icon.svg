<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>

  <!-- Glowing Accent Circle -->
  <circle cx="256" cy="256" r="140" fill="url(#accentGrad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Compass / Shield Outer Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-dasharray="24 16"/>

  <!-- Center Pin & Check Shield Icon -->
  <g transform="translate(156, 140)">
    <!-- Shield / Location Shape -->
    <path d="M100 12 C160 12, 190 40, 190 90 C190 155, 100 220, 100 220 C100 220, 10 155, 10 90 C10 40, 40 12, 100 12 Z" fill="url(#accentGrad)"/>
    
    <!-- Inner Star / Checkmark -->
    <circle cx="100" cy="85" r="42" fill="#0f172a"/>
    <path d="M85 85 L95 95 L118 72" fill="none" stroke="url(#emeraldGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 4-Star KPI Indicator at Bottom -->
  <g transform="translate(196, 400)">
    <circle cx="20" cy="20" r="10" fill="#fbbf24"/>
    <circle cx="50" cy="20" r="10" fill="#fbbf24"/>
    <circle cx="80" cy="20" r="10" fill="#fbbf24"/>
    <circle cx="110" cy="20" r="10" fill="#fbbf24"/>
  </g>
</svg>
